    { t: 'Inductors', chip: 'what it is',

      body: `<p>When your transistor suddenly cuts the current, the coil's stored energy jumps out as a voltage spike. It can be many times your supply voltage, and it kills transistors and MOSFETs.</p>
             <p><b>Fix:</b> a <b>flyback diode</b> across the coil, stripe toward +. It gives the current a loop to fade away in. Mount it close to the coil.{{jlc_fly}}</p>
